<text x="68" y="716.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">What never crosses the boundary from an endpoint: file contents, browsing, keystrokes, e-mail, passwords, clear-text user names.</text>
