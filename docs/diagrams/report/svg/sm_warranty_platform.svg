<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="774" viewBox="0 0 1400 774" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Warranty state machine (platform)</title>
<defs>
<marker id="m-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L11,6 L0,11 z" fill="#0b0e14"/></marker>
<marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L11,6 L0,11" fill="none" stroke="#0b0e14" stroke-width="1.3"/></marker>
<marker id="m-tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 z" fill="#ffffff" stroke="#0b0e14" stroke-width="1.2"/></marker>
<marker id="m-diamond" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#0b0e14" stroke="#0b0e14"/></marker>
<marker id="m-odiamond" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#ffffff" stroke="#0b0e14"/></marker>
<marker id="m-many" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M19,2 L5,10 L19,18 M5,2 L5,18" fill="none" stroke="#0b0e14" stroke-width="1.2"/></marker>
<marker id="m-one" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M9,3 L9,17 M14,3 L14,17" fill="none" stroke="#0b0e14" stroke-width="1.2"/></marker>
<marker id="m-zmany" viewBox="0 0 26 20" refX="25" refY="10" markerWidth="26" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M25,2 L13,10 L25,18" fill="none" stroke="#0b0e14" stroke-width="1.2"/><circle cx="7" cy="10" r="4" fill="#ffffff" stroke="#0b0e14" stroke-width="1.2"/></marker>
</defs>
<rect width="1400" height="774" fill="#ffffff"/>
<text x="20" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0b0e14">Warranty state machine on the platform: one per bound policy × warranty control</text>
<rect x="20" y="50" width="1360" height="470" rx="0" fill="none" stroke="#0b0e14" stroke-width="1.2"/>
<polygon points="20,50 273.75,50 273.75,64 265.75,72 20,72" fill="#ffffff" stroke="#0b0e14" stroke-width="1.2"/>
<text x="27" y="65.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0e14">stm  Warranty  (coverage.evaluate_policy)</text>
<circle cx="90" cy="205" r="8" fill="#0b0e14"/>
<rect x="170" y="160" width="230" height="90" rx="14" fill="#e2f4e8" stroke="#145c33" stroke-width="1.5"/>
<text x="285.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#145c33">MET</text>
<polyline points="170,189 400,189" fill="none" stroke="#145c33" stroke-width="0.8" stroke-linejoin="round"/>
<text x="285.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">no coverage consequence</text>
<rect x="590" y="160" width="240" height="90" rx="14" fill="#fff2d6" stroke="#8a4b06" stroke-width="1.5"/>
<text x="710.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#8a4b06">IN_GRACE</text>
<polyline points="590,189 830,189" fill="none" stroke="#8a4b06" stroke-width="0.8" stroke-linejoin="round"/>
<text x="710.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">grace period running</text>
<text x="710.0" y="219.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">(7 or 14 days)</text>
<rect x="1060" y="160" width="260" height="90" rx="14" fill="#ffe8e6" stroke="#9b1c22" stroke-width="1.5"/>
<text x="1190.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#9b1c22">BREACHED</text>
<polyline points="1060,189 1320,189" fill="none" stroke="#9b1c22" stroke-width="0.8" stroke-linejoin="round"/>
<text x="1190.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">configured coverage</text>
<text x="1190.0" y="219.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">consequence applies</text>
<rect x="590" y="400" width="240" height="90" rx="14" fill="#e3edf9" stroke="#1a4f8f" stroke-width="1.5"/>
<text x="710.0" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4f8f">REMEDIATED</text>
<polyline points="590,429 830,429" fill="none" stroke="#1a4f8f" stroke-width="0.8" stroke-linejoin="round"/>
<text x="710.0" y="445.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">transient: restored to MET</text>
<text x="710.0" y="459.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14">in the same evaluation</text>
<polyline points="98,205 170,205" fill="none" stroke="#0b0e14" stroke-width="1.2" marker-end="url(#m-arrow)" stroke-linejoin="round"/>
<text x="128.0" y="229.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">bind /</text>
<text x="128.0" y="242.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">initialize_warranties()</text>
<polyline points="400,190 590,190" fill="none" stroke="#0b0e14" stroke-width="1.2" marker-end="url(#m-arrow)" stroke-linejoin="round"/>
<text x="495.0" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">control FAIL /</text>
<text x="495.0" y="163.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">breach_detected_at = now,</text>
<text x="495.0" y="177.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">grace_expires_at = now + grace</text>
<polyline points="830,190 1060,190" fill="none" stroke="#0b0e14" stroke-width="1.2" marker-end="url(#m-arrow)" stroke-linejoin="round"/>
<text x="945.0" y="168.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[now ≥ grace_expires_at]</text>
<text x="945.0" y="181.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">still FAIL</text>
<polyline points="710,250 710,400" fill="none" stroke="#0b0e14" stroke-width="1.2" marker-end="url(#m-arrow)" stroke-linejoin="round"/>
<text x="718.0" y="315.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">PASS or PARTIAL /</text>
<text x="718.0" y="328.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">clear grace dates</text>
<polyline points="1190,250 1190,445 830,445" fill="none" stroke="#0b0e14" stroke-width="1.2" marker-end="url(#m-arrow)" stroke-linejoin="round"/>
<text x="1010.0" y="423.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">PASS or PARTIAL /</text>
<text x="1010.0" y="436.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">clear grace dates</text>
<polyline points="590,445 285,445 285,250" fill="none" stroke="#0b0e14" stroke-width="1.2" marker-end="url(#m-arrow)" stroke-linejoin="round"/>
<text x="437.5" y="423.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[immediately] /</text>
<text x="437.5" y="436.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0e14" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">"Warranty restored"</text>
<polygon points="60,300 238,300 250,312 250,392 60,392" fill="#fffdf5" stroke="#b9a978" stroke-width="1"/>
<polyline points="238,300 238,312 250,312" fill="none" stroke="#b9a978" stroke-width="1"/>
<text x="68" y="316.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">Evidence UNKNOWN: no</text>
<text x="68" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">change. Absence of a report</text>
<text x="68" y="344.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">is not a breach.</text>
<text x="68" y="358.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">Every transition writes a</text>
<text x="68" y="372.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">warranty_event and audit row.</text>
<polygon points="880,290 1088,290 1100,302 1100,374 880,374" fill="#fffdf5" stroke="#b9a978" stroke-width="1"/>
<polyline points="1088,290 1088,302 1100,302" fill="none" stroke="#b9a978" stroke-width="1"/>
<text x="888" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">Expiry is also checked</text>
<text x="888" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">lazily on every read of the</text>
<text x="888" y="334.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">warranties, and by the demo's</text>
<text x="888" y="348.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0b0e14">fast-forward (DEMO_TIME_TRAVEL).</text>
<text x="30" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0b0e14">Warranty controls and their configured consequences (catalogue.py, illustrative wording)</text>
<rect x="30" y="566" width="1340" height="125.39999999999999" rx="0" fill="#ffffff" stroke="#0b0e14" stroke-width="1"/>
<rect x="30" y="566" width="1340" height="20.9" rx="0" fill="#f7f8fa" stroke="#0b0e14" stroke-width="1"/>
<text x="38" y="579.794" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#0b0e14">Control</text>
<text x="248" y="579.794" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#0b0e14">Grace</text>
<text x="338" y="579.794" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#0b0e14">Coverage consequence while BREACHED</text>
<text x="38" y="600.694" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">CTRL-MFA</text>
<text x="248" y="600.694" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">7 days</text>
<text x="338" y="600.694" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">Ransomware and cyber-extortion coverage head suspended</text>
<polyline points="30,586.9 1370,586.9" fill="none" stroke="#c9cfd8" stroke-width="0.8" stroke-linejoin="round"/>
<text x="38" y="621.5939999999999" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">CTRL-BACKUP-TESTED</text>
<text x="248" y="621.5939999999999" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">7 days</text>
<text x="338" y="621.5939999999999" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">Data-restoration claims subject to 50 % co-insurance</text>
<polyline points="30,607.8 1370,607.8" fill="none" stroke="#c9cfd8" stroke-width="0.8" stroke-linejoin="round"/>
<text x="38" y="642.494" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">CTRL-EDR</text>
<text x="248" y="642.494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">7 days</text>
<text x="338" y="642.494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">Incident-response deductible doubled</text>
<polyline points="30,628.7 1370,628.7" fill="none" stroke="#c9cfd8" stroke-width="0.8" stroke-linejoin="round"/>
<text x="38" y="663.394" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">CTRL-PATCH-CRIT</text>
<text x="248" y="663.394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">14 days</text>
<text x="338" y="663.394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">Claims arising from unpatched critical CVEs subject to co-insurance</text>
<polyline points="30,649.6 1370,649.6" fill="none" stroke="#c9cfd8" stroke-width="0.8" stroke-linejoin="round"/>
<text x="38" y="684.294" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">CTRL-AGENT-COVERAGE</text>
<text x="248" y="684.294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">14 days</text>
<text x="338" y="684.294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0b0e14">Unmonitored endpoints treated as non-compliant with every warranty</text>
<polyline points="30,670.5 1370,670.5" fill="none" stroke="#c9cfd8" stroke-width="0.8" stroke-linejoin="round"/>
<text x="30" y="742" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#555d6b">What triggers an evaluation: any new observation for the company (questionnaire, document, fleet roll-up), bind itself, and the expiry check. The premium never changes.</text>
</svg>
