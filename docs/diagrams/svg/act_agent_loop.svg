<polyline points="958,210 958,222 970,222" fill="none" stroke="#b9a978" stroke-width="1"/>
<text x="648" y="226.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#0b0e14">Any exception is written to agent-errors.log;</text>
<text x="648" y="240.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#0b0e14">the loop survives it. Only this service scans</text>
<text x="648" y="255.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#0b0e14">and sends: the outbox and seq stay consistent.</text>
<text x="16" y="1366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#555d6b" font-style="italic">Figure B13. Activity diagram of the agent loop. Small diamonds merge flows.</text>
