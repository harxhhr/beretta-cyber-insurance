<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="292" viewBox="0 0 1000 292" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Severity shape check</title>
<rect width="1000" height="292" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="18" text-anchor="start" fill="#0b0e14" font-weight="700">Check on the lognormal shape: share of SME claims above $500K</text>
<text x="316.0" y="94.0" font-size="14" text-anchor="end" fill="#0b0e14" font-weight="400">Observed (NetDiligence 2025 SMEs)</text>
<rect x="330.0" y="70.0" width="323.7" height="38.0" fill="#0b0e14" stroke="none"/>
<text x="663.7" y="94.0" font-size="14" text-anchor="start" fill="#0b0e14" font-weight="700">8.24%</text>
<text x="316.0" y="148.0" font-size="14" text-anchor="end" fill="#0b0e14" font-weight="400">σ = 2.193 (kept)</text>
<rect x="330.0" y="124.0" width="324.5" height="38.0" fill="#145c33" stroke="none"/>
<text x="664.5" y="148.0" font-size="14" text-anchor="start" fill="#0b0e14" font-weight="700">8.26%</text>
<text x="316.0" y="202.0" font-size="14" text-anchor="end" fill="#0b0e14" font-weight="400">σ = 1.214 (rejected)</text>
<rect x="330.0" y="178.0" width="505.2" height="38.0" fill="#a3261b" stroke="none"/>
<text x="845.2" y="202.0" font-size="14" text-anchor="start" fill="#0b0e14" font-weight="700">12.86%</text>
<text x="20.0" y="270.0" font-size="12.5" text-anchor="start" fill="#555d6b" font-weight="400" font-style="italic">Both roots match the mean ($264K) and P(X &gt; $1M) = 395/8,936; only σ = 2.193 also matches the $500K point.</text>
</svg>
