<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>From expected loss to payable premium</title>
<rect width="1100" height="300" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="18" text-anchor="start" fill="#0b0e14" font-weight="700">From expected loss to payable premium, worked example</text>
<rect x="40.0" y="90.0" width="432.2" height="60.0" fill="#1d5fbf" stroke="none"/>
<text x="256.1" y="126.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">₹49,947</text>
<text x="256.1" y="178.0" font-size="13" text-anchor="middle" fill="#0b0e14" font-weight="400">Expected loss</text>
<rect x="472.2" y="90.0" width="259.3" height="60.0" fill="#9aa4b5" stroke="none"/>
<text x="601.9" y="126.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">₹29,968</text>
<text x="601.9" y="178.0" font-size="13" text-anchor="middle" fill="#0b0e14" font-weight="400">Expenses 30%</text>
<rect x="731.5" y="90.0" width="172.9" height="60.0" fill="#5b6474" stroke="none"/>
<text x="818.0" y="126.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">₹19,979</text>
<text x="818.0" y="178.0" font-size="13" text-anchor="middle" fill="#0b0e14" font-weight="400">Profit, risk, reinsurance 20%</text>
<rect x="904.4" y="90.0" width="155.6" height="60.0" fill="#8a5a00" stroke="none"/>
<text x="982.2" y="126.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">₹17,981</text>
<text x="982.2" y="178.0" font-size="13" text-anchor="middle" fill="#0b0e14" font-weight="400">GST 18%</text>
<line x1="904.4" y1="76.0" x2="904.4" y2="164.0" stroke="#0b0e14" stroke-width="2"/>
<text x="904.4" y="70.0" font-size="12.5" text-anchor="end" fill="#0b0e14" font-weight="400">technical premium ₹99,895 (EL ÷ TLR 0.50)</text>
<text x="1060.0" y="70.0" font-size="12.5" text-anchor="end" fill="#0b0e14" font-weight="700">payable ₹1,17,876</text>
<text x="20.0" y="276.0" font-size="12.5" text-anchor="start" fill="#555d6b" font-weight="400" font-style="italic">The bound premium is the technical premium; GST is shown on its own line.</text>
</svg>
