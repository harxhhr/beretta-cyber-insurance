<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beretta — Explainable Cyber Insurance Underwriting</title>
  <meta name="theme-color" content="#f2f4f7">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="phonebar">
      <a class="brand" href="#/forms" aria-label="Beretta home">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="13" width="4" height="8" rx="1" fill="#9aa4b5"/><rect x="6.5" y="10" width="4" height="11" rx="1" fill="#6b8fcf"/><rect x="12" y="6" width="4" height="15" rx="1" fill="#3a6fc4"/><rect x="17.5" y="1" width="4" height="20" rx="1" fill="#12161d"/></svg>
        <span><b>Beretta</b></span>
      </a>
      <button class="navtoggle" id="navToggle" aria-expanded="false" aria-controls="side">Menu</button>
    </header>

    <aside class="side" id="side">
      <a class="brand" href="#/forms" aria-label="Beretta home">
        <svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="13" width="4" height="8" rx="1" fill="#9aa4b5"/><rect x="6.5" y="10" width="4" height="11" rx="1" fill="#6b8fcf"/><rect x="12" y="6" width="4" height="15" rx="1" fill="#3a6fc4"/><rect x="17.5" y="1" width="4" height="20" rx="1" fill="#12161d"/></svg>
        <span><b>Beretta</b><small>Cyber insurance</small></span>
      </a>
      <nav class="mainnav" id="nav" aria-label="Main">
        <div class="group">Underwriting</div>
        <a href="#/forms" data-view="forms">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.75h5.5L12.25 4.5v9.75H4z"/><path d="M6.25 7.5h4M6.25 10.25h4"/></svg>Questionnaires</a>
        <a href="#/mine" data-view="mine" class="customer-only" id="navMine">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.75 2.75 4v4c0 3 2.25 5.25 5.25 6.25 3-1 5.25-3.25 5.25-6.25V4z"/><path d="m5.75 8 1.5 1.5 3-3"/></svg>My policy</a>
        <a href="#/dashboard" data-view="dashboard" class="staff-only">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 14h12"/><path d="M4 11V7M8 11V3M12 11V5.5"/></svg>Portfolio</a>
        <a href="#/companies" data-view="companies" class="staff-only">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 14V3.5h6.5V14M9 7h4.5v7M1.5 14h13"/><path d="M5 6h1.5M5 9h1.5M11 10h1"/></svg>Companies</a>
        <div class="group">Records</div>
        <a href="#/audit" data-view="audit" class="staff-only">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.75V8l2.25 1.5"/></svg>Audit log</a>
        <a href="#/regulatory" data-view="regulatory">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5.5 8 2.5l6 3M3.5 6v6M6.5 6v6M9.5 6v6M12.5 6v6M2 13.5h12"/></svg>Regulatory context</a>
        <div class="group staff-only">Settings</div>
        <a href="#/admin" data-view="admin" class="staff-only">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="10.5" cy="4.5" r="1.75" fill="#f2f4f7"/><circle cx="5.5" cy="11.5" r="1.75" fill="#f2f4f7"/></svg>Model configuration</a>
      </nav>
      <div class="rolebox">
        <span>Acting as</span>
        <select id="roleSelect" aria-label="Active role">
          <option value="UNDERWRITER">Underwriter</option>
          <option value="CUSTOMER">Insured customer</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>
    </aside>

    <main id="main" aria-live="polite"></main>
  </div>
  <div id="overlay"></div>
  <script src="/app.js"></script>
</body>
</html>
